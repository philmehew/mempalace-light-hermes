          - leak
          - broken
          - valve
          - seal
          - pipe
          - wiring

  # --- Vehicles ---
  vehicles:
    keywords:
      - car
      - bike
      - motorbike
      - honda
      - vfr
      - tyre
      - oil
      - mot
      - service
      - battery
      - exhaust
      - mot
    rooms:
      motorbike:
        keywords:
          - vfr
          - motorbike
          - honda
          - helmet
          - chain
          - sprocket

  # --- Projects: specific builds, code, development ---
  projects:
    keywords:
      - project
      - build
      - deploy
      - github
      - git
      - commit
      - repo
      - code
      - python
      - script
      - api
      - discord
      - iracing
      - spotter
    rooms:
      iracing:
        keywords:
          - iracing
          - spotter
          - racing
          - telemetry
          - setup
          - lap

  # --- General: the improvement signal bucket ---
  general:
    keywords: []
    rooms:
      general:
        keywords: []