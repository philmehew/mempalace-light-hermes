    keywords:
      - house
      - repair
      - fix
      - plumbing
      - electrical
      - kitchen
      - bathroom
      - toilet
      - valve
      - boiler
      - heating
      - radiator
      - diy
      - garden
      - lawn
      - fence
    rooms:
      maintenance:
