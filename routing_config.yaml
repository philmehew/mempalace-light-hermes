# MemPalace Light — Configuration
#
# Updated July 2026: The regex-based extraction patterns have been removed.
# The scavenger cron is now LLM-driven — the agent reads recent sessions
# via session_search, extracts facts with contextual understanding,
# and files drawers + KG triples via MCP.
#
# This file now only contains wing/room routing keywords, retained for
# reference and potential future use by the LLM scavenger for routing hints.
#
# --- Wing/Room Routing Targets ---

